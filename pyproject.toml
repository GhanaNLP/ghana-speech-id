[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghana-speech-id"
version = "0.1.0"
description = "Language identification for Ghanaian and West African speech, over IPA phonemes"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Ghana NLP", email = "info@ghananlp.org" }]
keywords = ["speech", "language-identification", "ghana", "ipa", "phonemes", "onnx", "lid"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The head is a dict lookup and one sparse gather, so the runtime stays tiny. Nothing is
# compiled: this ships as a single py3-none-any wheel.
dependencies = [
  "numpy>=1.21",
  "onnxruntime>=1.16",
  "huggingface_hub>=0.20",
]

[project.optional-dependencies]
# End to end from audio. Kept optional so the head alone stays a light install.
asr = ["ghana-ipa-asr"]
# Everything needed to retrain, in scripts/.
train = ["scikit-learn>=1.3", "pyarrow>=15", "duckdb>=1.0", "joblib", "onnx", "datasets", "soundfile"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
ghana-speech-id = "ghana_speech_id.cli:main"

[project.urls]
Homepage = "https://github.com/GhanaNLP/ghana-speech-id"
Issues = "https://github.com/GhanaNLP/ghana-speech-id/issues"

[tool.hatch.build.targets.wheel]
packages = ["python/ghana_speech_id"]

[tool.hatch.build.targets.sdist]
# the sdist carries the training pipeline and the C++ sources; the wheel does not
include = ["python/", "scripts/", "src/", "include/", "tests/", "bindings/",
           "CMakeLists.txt", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py39"
